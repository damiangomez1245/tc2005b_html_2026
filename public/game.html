<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0f172a;
      color: white;
      text-align: center;
    }

    #unity-container {
      margin-top: 20px;
      display: flex; /* Centra el juego */
      justify-content: center;
    }

    /* ¡AQUÍ ESTÁ EL CANDADO! */
    #unity-canvas {
      width: 960px !important; 
      height: 600px !important;
      max-width: 100%; /* Para que no se rompa en pantallas pequeñas */
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
  </style>
</head>

<body>

<!-- 🔒 PROTECCIÓN LOGIN -->
<script>
  const localUserId = localStorage.getItem("userId");

  if (!localUserId) {
    alert("Debes iniciar sesión");
    window.location.href = "index.html";
  }
</script>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand">🎮 Juego</a>
    <button onclick="logout()" class="btn btn-danger">Salir</button>
  </div>
</nav>

<!-- USER INFO -->
<h3 class="mt-3">Usuario ID: <span id="userIdText"></span></h3>

<!-- UNITY -->
<div id="unity-container">
  <canvas id="unity-canvas" width="960" height="600"></canvas>

  <div id="unity-loading-bar">
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>
</div>

<!-- 🔥 OBTENER ID DESDE URL -->
<script>
  const params = new URLSearchParams(window.location.search);
  const userId = params.get("id");

  document.getElementById("userIdText").textContent = userId;

  // Lo hacemos global para Unity
  window.userId = userId;
</script>

<!-- 🎮 UNITY CONFIG -->
<script>
  var canvas = document.querySelector("#unity-canvas");

  var buildUrl = "Build";

  // ⚠️ CAMBIA ESTO SI TUS ARCHIVOS TIENEN OTRO NOMBRE
  var loaderUrl = buildUrl + "/juego.loader.js";

  var config = {
    dataUrl: buildUrl + "/juego.data",
    frameworkUrl: buildUrl + "/juego.framework.js",
    codeUrl: buildUrl + "/juego.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "TuEmpresa",
    productName: "MiJuego",
    productVersion: "1.0"
  };

  var script = document.createElement("script");
  script.src = loaderUrl;

  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
    }).catch((message) => {
      alert(message);
    });
  };

  document.body.appendChild(script);
</script>

<!-- LOGOUT -->
<script>
  function logout() {
    localStorage.removeItem("userId");
    window.location.href = "index.html";
  }
</script>

</body>
</html>
